name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read Godot-JVM version from build.gradle.kts
        run: |
          version=$(sed -nE 's/.*id\("com\.utopia-rise\.godot-jvm"\) version "([^"]+)".*/\1/p' build.gradle.kts)
          test -n "$version"
          echo "GODOT_JVM_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the Godot-JVM addon
        run: |
          gh release download "$GODOT_JVM_VERSION" \
            --repo utopia-rise/godot-jvm \
            --pattern "godot-jvm-addon-$GODOT_JVM_VERSION.zip" \
            --output addon.zip
          unzip -qo addon.zip -d .
          rm addon.zip

      - name: Build the project JARs
        run: ./gradlew build

      - name: Package the project
        run: |
          name="${{ github.event.repository.name }}-${{ github.ref_name }}"
          mkdir -p "package/$name"
          rsync -a \
            --exclude .git --exclude .github --exclude .gradle --exclude .kotlin \
            --exclude .idea --exclude .godot --exclude build --exclude package \
            ./ "package/$name/"
          cd package
          zip -qr "../$name.zip" "$name"
          cd ..
          unzip -l "$name.zip" | grep -E "addons/jvm/jvm.gdextension|jvm/godot-bootstrap.jar|jvm/main.jar"

      - name: Create the GitHub release
        run: |
          godot_version=$(sed -nE 's/.*PackedStringArray\("([0-9.]+)".*/\1/p' project.godot)
          gh release create "${{ github.ref_name }}" \
            "${{ github.event.repository.name }}-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --notes "Built with Godot-JVM $GODOT_JVM_VERSION for Godot $godot_version.

          The zip contains the project sources, the Godot-JVM addon and the built JARs. Unzip it and open \`project.godot\` with the Godot $godot_version editor. A JDK 17+ must be available through \`JAVA_HOME\` or \`PATH\`."
